name: Hakyll site CI

on:
  push:
    branches:
      - source
  pull_request:
    branches:
      - source
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLAGS: "--flag hakyll:-previewServer --flag hakyll:-watchServer --flag hakyll:-checkexternal"
      FORESTER_VERSION: "5.0"
      LANG: en_US.UTF-8
      OCAML_VERSION: "5.3"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/configure-pages@v5

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10.3"
          enable-stack: true
          stack-no-global: true
          stack-version: latest

      - name: Cache Forester
        id: cache-forester
        uses: actions/cache@v4
        with:
          path: ~/.cache/forester/bin
          key: forester-${{ env.FORESTER_VERSION }}-ocaml-${{ env.OCAML_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      - uses: ocaml/setup-ocaml@v3
        if: steps.cache-forester.outputs.cache-hit != 'true'
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - name: Install Forester
        if: steps.cache-forester.outputs.cache-hit != 'true'
        run: |
          opam install "forester.${FORESTER_VERSION}"
          install -Dm755 "$(opam var bin)/forester" "$HOME/.cache/forester/bin/forester"

      - name: Add Forester to PATH
        run: echo "$HOME/.cache/forester/bin" >> "$GITHUB_PATH"

      - name: Verify Forester
        run: test "$(forester --version)" = "${FORESTER_VERSION}"

      - name: Cache Stack state
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml', 'L-TChen-github-io.cabal') }}
          restore-keys: |
            stack-${{ runner.os }}-

      - name: Build the site
        run: make build STACK_FLAGS="${FLAGS}"

      - name: Check the site
        run: make check STACK_FLAGS="${FLAGS}"

      - name: Install XSLT processor
        run: sudo apt-get update && sudo apt-get install -y xsltproc

      - name: Pre-render Forester pages
        shell: bash
        run: |
          set -euo pipefail
          stylesheet="$PWD/_site/posts/default.xsl"
          test -f "$stylesheet"

          while IFS= read -r -d '' xml; do
            html="${xml%.xml}.html"
            xsltproc --output "$html" "$stylesheet" "$xml"
            rm "$xml"
          done < <(find _site/posts -type f -name 'index.xml' -print0)

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/source'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
