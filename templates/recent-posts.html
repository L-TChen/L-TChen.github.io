<div class="list-group list-group-flush">
$for(posts)$
<div class="list-group-item recent-post-item">
  <p class="recent-post-title">
    <a href="$url$">$title$</a>
  </p>
  <p class="recent-post-meta">$date$ <span aria-hidden="true">&middot;</span> $taxon$</p>
</div>
$endfor$
</div>

<p class="recent-post-more">
  <a href="$postsUrl$">See all posts</a>
</p>
