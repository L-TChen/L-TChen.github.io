<main class="post-shell container py-5">
  <div class="row justify-content-center">
    <article class="col-12 post-main-column">
      <header class="post-archive-header">
        <a class="post-back-link" href="/posts.html">All posts</a>
        <p class="post-summary-meta">$date$ <span aria-hidden="true">&middot;</span> $category$</p>
        <h1 class="post-title post-summary-title">$title$</h1>
        $if(tags)$
          <div class="post-tag-list" aria-label="Tags">
            $tags$
          </div>
        $endif$
      </header>

      <section class="post-summary post-detail">
        <div class="post-body">
          $body$
        </div>
      </section>

      <section class="post-summary post-comments">
        <script src="https://giscus.app/client.js"
                data-repo="L-TChen/L-TChen.github.io"
                data-repo-id="MDEwOlJlcG9zaXRvcnkyMDQyNzQzNDE="
                data-category="Comments"
                data-category-id="DIC_kwDODCz6pc4CUxfd"
                data-mapping="pathname"
                data-strict="0"
                data-reactions-enabled="0"
                data-emit-metadata="0"
                data-input-position="top"
                data-theme="preferred_color_scheme"
                data-lang="en"
                crossorigin="anonymous"
                async>
        </script>
      </section>
    </article>
  </div>
</main>
