<div class="py-5">
  <div class="row g-4 align-items-start">
    <div class="col-12 col-xl-8 offset-xl-2 order-2 order-xl-1">
      <header class="mb-4">
        <h1>$title$</h1>
        <p class="text-body-secondary mb-0">Some random thoughts.</p>
      </header>

      <section class="list-group list-group-flush" data-post-archive>
      $for(posts)$
        <article class="list-group-item px-0 py-4 bg-transparent" data-post-tags="$tagFilter$">
          <p class="small text-body-secondary mb-1">$date$ <span aria-hidden="true">&middot;</span> $taxon$</p>
          <h2 class="h4 mb-0"><a href="$url$">$title$</a></h2>
          $if(tags)$
            <div class="d-flex flex-wrap gap-2 mt-3" aria-label="Tags">
              $tags$
            </div>
          $endif$
        </article>
      $endfor$
      <p class="d-none text-body-secondary pt-3" data-post-empty>No posts match the selected tag yet.</p>
      </section>
    </div>

    <aside class="col-12 col-xl-2 order-1 order-xl-2 sticky-xl-top sticky-below-navbar">
      <section class="border rounded-3 bg-body-tertiary p-3" aria-label="Post tag filters">
        <p class="small fw-semibold text-body-secondary mb-3">Filter by tag</p>
        <div class="d-flex flex-wrap flex-xl-column gap-2">
          <button type="button" class="btn btn-sm btn-outline-secondary active text-start" data-post-filter="all" aria-pressed="true">All</button>
          $for(tags)$
            <button type="button" class="btn btn-sm btn-outline-secondary text-start" data-post-filter="$value$" aria-pressed="false">$label$</button>
          $endfor$
        </div>
      </section>
    </aside>
  </div>
</div>
<script>
  (() => {
    const buttons = Array.from(document.querySelectorAll("[data-post-filter]"));
    const posts = Array.from(document.querySelectorAll("[data-post-tags]"));
    const emptyState = document.querySelector("[data-post-empty]");

    if (buttons.length === 0 || posts.length === 0) {
      return;
    }

    const validFilters = new Set(buttons.map((button) => button.dataset.postFilter));

    const updateUrl = (selectedTag) => {
      const url = new URL(window.location.href);
      if (selectedTag === "all") {
        url.searchParams.delete("tag");
      } else {
        url.searchParams.set("tag", selectedTag);
      }
      window.history.replaceState({}, "", url);
    };

    const applyFilter = (selectedTag) => {
      let visibleCount = 0;

      posts.forEach((post) => {
        const tags = post.dataset.postTags
          ? post.dataset.postTags.split("|").filter(Boolean)
          : [];
        const isVisible = selectedTag === "all" || tags.includes(selectedTag);
        post.classList.toggle("d-none", !isVisible);
        if (isVisible) {
          visibleCount += 1;
        }
      });

      buttons.forEach((button) => {
        const isActive = button.dataset.postFilter === selectedTag;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      if (emptyState) {
        emptyState.classList.toggle("d-none", visibleCount > 0);
      }

      updateUrl(selectedTag);
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => applyFilter(button.dataset.postFilter));
    });

    const requestedTag = new URLSearchParams(window.location.search).get("tag");
    const initialTag =
      requestedTag && validFilters.has(requestedTag)
        ? requestedTag
        : "all";

    applyFilter(initialTag);
  })();
</script>
