<div class="site-content-layout">
  <div class="site-primary-column site-primary-column--archive">
    <header class="post-archive-header">
      <h1>$title$</h1>
      <p class="post-archive-subtitle">Some random thoughts.</p>
    </header>

    <section class="list-group list-group-flush" data-post-archive>
    $for(posts)$
      <article class="list-group-item post-archive-item" data-post-tags="$tagFilter$">
        <p class="post-archive-meta">$date$ <span aria-hidden="true">&middot;</span> $taxon$</p>
        <h2 class="post-archive-title"><a href="$url$">$title$</a></h2>
        $if(tags)$
          <div class="post-tag-list" aria-label="Tags">
            $tags$
          </div>
        $endif$
      </article>
    $endfor$
    <p class="d-none post-archive-empty" data-post-empty>No posts match the selected tag yet.</p>
    </section>
  </div>

  <aside class="site-sidebar">
    <section class="site-panel" aria-label="Post tag filters">
      <p class="site-panel-title">Filter by tag</p>
      <div class="site-filter-list">
        <button type="button" class="btn btn-sm btn-outline-secondary active site-filter-button" data-post-filter="all" aria-pressed="true">All</button>
        $for(tags)$
          <button type="button" class="btn btn-sm btn-outline-secondary site-filter-button" data-post-filter="$value$" aria-pressed="false">$label$</button>
        $endfor$
      </div>
    </section>
  </aside>
</div>
<script>
  (() => {
    const buttons = Array.from(document.querySelectorAll("[data-post-filter]"));
    const posts = Array.from(document.querySelectorAll("[data-post-tags]"));
    const emptyState = document.querySelector("[data-post-empty]");

    if (buttons.length === 0 || posts.length === 0) {
      return;
    }

    const validFilters = new Set(buttons.map((button) => button.dataset.postFilter));

    const updateUrl = (selectedTag) => {
      const url = new URL(window.location.href);
      if (selectedTag === "all") {
        url.searchParams.delete("tag");
      } else {
        url.searchParams.set("tag", selectedTag);
      }
      window.history.replaceState({}, "", url);
    };

    const applyFilter = (selectedTag) => {
      let visibleCount = 0;

      posts.forEach((post) => {
        const tags = post.dataset.postTags
          ? post.dataset.postTags.split("|").filter(Boolean)
          : [];
        const isVisible = selectedTag === "all" || tags.includes(selectedTag);
        post.classList.toggle("d-none", !isVisible);
        if (isVisible) {
          visibleCount += 1;
        }
      });

      buttons.forEach((button) => {
        const isActive = button.dataset.postFilter === selectedTag;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });

      if (emptyState) {
        emptyState.classList.toggle("d-none", visibleCount > 0);
      }

      updateUrl(selectedTag);
    };

    buttons.forEach((button) => {
      button.addEventListener("click", () => applyFilter(button.dataset.postFilter));
    });

    const requestedTag = new URLSearchParams(window.location.search).get("tag");
    const initialTag =
      requestedTag && validFilters.has(requestedTag)
        ? requestedTag
        : "all";

    applyFilter(initialTag);
  })();
</script>
